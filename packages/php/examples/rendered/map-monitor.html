                                <span dir="auto" x-show="hasDetail(a)" x-text="detailOf(a)" class="truncate text-caption text-muted-foreground" style="display: none"></span>
                                <span class="text-caption text-muted-foreground" x-text="sub(a)"></span>
                            </span>
                        </button>
                    </li>
                </template>
            </ul>
            <p x-show="visible.length === 0" class="px-4 py-8 text-center text-body-sm text-muted-foreground">No alerts in this time range.</p>
        </aside>
    </div>
</section>
