<button data-slot="button"
     type="button"                         x-on:click="nqToast.success(&#039;Invoice sent&#039;)" class="inline-flex shrink-0 select-none items-center justify-center gap-2 whitespace-nowrap rounded-control border font-sans text-label transition-colors duration-150 ease-nq min-h-[var(--nq-touch-min,0px)] outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nq-focus disabled:pointer-events-none disabled:opacity-50 data-disabled:pointer-events-none data-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 border-border bg-card text-foreground hover:bg-nq-hover h-control px-[var(--nq-control-pad)]">
        Send invoice</button>
<section data-slot="toaster" x-data="nqToaster(4000)" x-bind="region" tabindex="-1"
    aria-label="Notifications" aria-live="polite"
    class="pointer-events-none fixed z-[100] w-[min(356px,calc(100vw-2rem))] bottom-4 end-4">
    <ol class="m-0 flex list-none flex-col gap-2 p-0">
        <template x-for="t in toasts" :key="t.id">
            <li data-slot="toast" role="status" :data-type="t.type"
                x-transition:enter="transition duration-200 ease-nq" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition duration-150 ease-nq" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
                class="pointer-events-auto relative flex items-start rounded-floating border border-border bg-popover p-4 font-sans text-body-sm text-popover-foreground shadow-floating gap-2">
                <span data-icon aria-hidden="true" class="mt-0.5 inline-flex shrink-0 [&_svg]:size-4" x-show="t.type !== 'message'">
                    <svg x-show="t.type === 'success'" class="text-nq-success-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="m9 12 2 2 4-4"/>
</svg>                    <svg x-show="t.type === 'error'" class="text-nq-danger-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="m15 9-6 6"/>
  <path d="m9 9 6 6"/>
</svg>                    <svg x-show="t.type === 'warning'" class="text-nq-warning-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <line x1="12" x2="12" y1="8" y2="12"/>
  <line x1="12" x2="12.01" y1="16" y2="16"/>
</svg>                    <svg x-show="t.type === 'info'" class="text-nq-info-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="M12 16v-4"/>
  <path d="M12 8h.01"/>
</svg>                </span>
                <div class="flex min-w-0 flex-1 flex-col gap-0.5">
                    <div data-title class="font-medium" x-text="t.title"></div>
                    <div data-description class="text-muted-foreground" x-show="t.description" x-text="t.description"></div>
                </div>
                <button type="button" data-close x-on:click="dismiss(t.id)" aria-label="Close"
                    class="-me-1 -mt-1 inline-flex size-6 shrink-0 items-center justify-center rounded-control text-muted-foreground transition-colors duration-150 hover:bg-nq-hover hover:text-foreground focus-visible:outline-2 focus-visible:outline-nq-focus [&_svg]:size-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M18 6 6 18"/>
  <path d="m6 6 12 12"/>
</svg></button>
            </li>
        </template>
    </ol>
</section>
