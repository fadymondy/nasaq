<div data-slot="field" x-data="nqField(false)" x-modelable="invalid" x-id="['nq-field']"
         data-valid     class="flex flex-col gap-1.5">
    <label data-slot="field-label"  class="text-label text-foreground data-disabled:opacity-50">Contact by</label>
    <p data-slot="field-description" class="text-caption text-muted-foreground">We only use this for account notices.</p>
    <div role="radiogroup" data-slot="radio-group" aria-orientation="vertical" x-data="nqRadioGroup('email')" x-modelable="value" x-bind="root"
                aria-label="Contact by" class="flex flex-col gap-2">
    <label class="flex items-center gap-2 text-body-sm">
            <button type="button" role="radio" data-slot="radio" x-bind="radio('email')"
    aria-checked="true" tabindex="0"
     data-checked         class="relative inline-flex size-4 shrink-0 items-center justify-center rounded-full border border-nq-line-strong bg-card outline-none transition-colors duration-150 ease-nq data-checked:border-primary data-checked:bg-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nq-focus data-disabled:cursor-not-allowed data-disabled:opacity-50 after:absolute after:-inset-1 after:rounded-full">
    <span data-slot="radio-indicator" class="block size-1.5 rounded-full bg-primary-foreground" x-show="isChecked('email')" ></span>
</button>
 Email
        </label>
        <label class="flex items-center gap-2 text-body-sm">
            <button type="button" role="radio" data-slot="radio" x-bind="radio('sms')"
    aria-checked="false" tabindex="-1"
     data-unchecked         class="relative inline-flex size-4 shrink-0 items-center justify-center rounded-full border border-nq-line-strong bg-card outline-none transition-colors duration-150 ease-nq data-checked:border-primary data-checked:bg-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nq-focus data-disabled:cursor-not-allowed data-disabled:opacity-50 after:absolute after:-inset-1 after:rounded-full">
    <span data-slot="radio-indicator" class="block size-1.5 rounded-full bg-primary-foreground" x-show="isChecked('sms')"  style="display: none" ></span>
</button>
 SMS
        </label>
    </div>
</div>
