<ol data-slot="stepper" data-orientation="horizontal" aria-label="Setup steps" class="m-0 flex list-none p-0 flex-row items-start">
    <li data-slot="stepper-item" data-status="complete"
    class="group/step flex flex-1 items-start last:flex-none">
    <div  data-slot="stepper-step"
                        class="items-start gap-3 rounded-control text-start outline-none flex shrink-0">
        <span data-slot="stepper-marker" class="relative z-10 inline-flex size-7 shrink-0 items-center justify-center rounded-full border text-caption font-medium transition-colors duration-150 ease-nq [&amp;_svg]:size-3.5 border-transparent bg-primary text-primary-foreground">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 6 9 17l-5-5"/>
</svg>        </span>
        <span data-slot="stepper-text" class="flex min-w-0 flex-col text-start">
            <span class="text-label text-foreground">
                Account
                <span class="sr-only"> (Completed)</span>
            </span>
            <span class="text-caption text-muted-foreground">Name and email</span>        </span>
    </div>
    <span aria-hidden="true" data-slot="stepper-connector"  data-complete=""         class="rounded-full transition-colors duration-150 ease-nq bg-primary mx-3 mt-3.5 h-px min-w-6 flex-1 group-last/step:hidden"></span>
</li>
    <li data-slot="stepper-item" data-status="current"
    class="group/step flex flex-1 items-start last:flex-none">
    <div  data-slot="stepper-step"
         aria-current="step"                 class="items-start gap-3 rounded-control text-start outline-none flex shrink-0">
        <span data-slot="stepper-marker" class="relative z-10 inline-flex size-7 shrink-0 items-center justify-center rounded-full border text-caption font-medium transition-colors duration-150 ease-nq [&amp;_svg]:size-3.5 border-nq-focus bg-background text-foreground ring-2 ring-nq-focus/30">
            <bdi data-slot="num" data-numeric="" class="tabular-nums">2</bdi>
        </span>
        <span data-slot="stepper-text" class="flex min-w-0 flex-col text-start">
            <span class="text-label text-foreground">
                Workspace
                <span class="sr-only"> (Current step)</span>
            </span>
            <span class="text-caption text-muted-foreground">Pick a plan</span>        </span>
    </div>
    <span aria-hidden="true" data-slot="stepper-connector"         class="rounded-full transition-colors duration-150 ease-nq bg-border mx-3 mt-3.5 h-px min-w-6 flex-1 group-last/step:hidden"></span>
</li>
    <li data-slot="stepper-item" data-status="upcoming"
    class="group/step flex flex-1 items-start last:flex-none">
    <div  data-slot="stepper-step"
                        class="items-start gap-3 rounded-control text-start outline-none flex shrink-0">
        <span data-slot="stepper-marker" class="relative z-10 inline-flex size-7 shrink-0 items-center justify-center rounded-full border text-caption font-medium transition-colors duration-150 ease-nq [&amp;_svg]:size-3.5 border-border bg-background text-muted-foreground">
            <bdi data-slot="num" data-numeric="" class="tabular-nums">3</bdi>
        </span>
        <span data-slot="stepper-text" class="flex min-w-0 flex-col text-start">
            <span class="text-label text-muted-foreground">
                Invite
                <span class="sr-only"> (Upcoming)</span>
            </span>
            <span class="text-caption text-muted-foreground">Add your team</span>        </span>
    </div>
    <span aria-hidden="true" data-slot="stepper-connector"         class="rounded-full transition-colors duration-150 ease-nq bg-border mx-3 mt-3.5 h-px min-w-6 flex-1 group-last/step:hidden"></span>
</li>
</ol>
