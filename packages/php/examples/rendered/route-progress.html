<div class="relative" x-data="{ loading: false, refresh() { this.loading = true; setTimeout(() => this.loading = false, 2000) } }">
    <div data-slot="route-progress" data-state="idle"
    x-data="nqRouteProgress(false, null, 250)" x-bind="root"
    role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
     aria-hidden="true"     x-modelable="active" x-model="loading" class="pointer-events-none inset-x-0 top-0 z-[60] h-0.5 overflow-hidden transition-opacity duration-200 ease-nq motion-reduce:transition-none absolute opacity-0">
    <div data-slot="route-progress-bar" x-bind="bar" style="inline-size: 0%"
        class="h-full rounded-e-full transition-[inline-size] duration-200 ease-nq motion-reduce:transition-none bg-primary"></div>
</div>
    <button data-slot="button"
     type="button"                     x-on:click="refresh()" class="inline-flex shrink-0 select-none items-center justify-center gap-2 whitespace-nowrap rounded-control border font-sans text-label transition-colors duration-150 ease-nq min-h-[var(--nq-touch-min,0px)] outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nq-focus disabled:pointer-events-none disabled:opacity-50 data-disabled:pointer-events-none data-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 border-border bg-card text-foreground hover:bg-nq-hover h-control px-[var(--nq-control-pad)]">
        Refresh</button>
</div>
