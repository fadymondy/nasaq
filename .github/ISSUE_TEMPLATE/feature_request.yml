name: Feature request
description: Suggest an idea or improvement for Nasaq.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Big or open-ended ideas are often better started in [Discussions → Ideas](https://github.com/fadymondy/nasaq/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - React components (packages/web)
        - Vue components
        - HTML / CSS
        - Design tokens and themes
        - shadcn registry
        - MCP server
        - Docs and Storybook lab
        - Arabic / RTL
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
