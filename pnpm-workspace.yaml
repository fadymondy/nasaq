packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  vue-demi: false

minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - fumadocs-core@16.15.17
  - fumadocs-ui@16.15.17
  - next@16.3.7

# Transitive advisories (MH-1322): shell-quote quote() injection, source-map-js DoS.
overrides:
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
